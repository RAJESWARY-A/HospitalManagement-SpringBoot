<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital Manager - Hospitals</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Hospital Manager</h1>
  <nav>
    <a href="index.html" aria-current="page">Hospitals</a>
    <a href="branches.html">Branches</a>
    <a href="patients.html">Patients</a>
  </nav>
</header>
<main>
  <section>
    <h2 id="formTitle"></h2>
    <form id="form"></form>
    <div id="msg" class="msg" role="status"></div>
  </section>
  <section>
    <h2>Hospitals</h2>
    <div class="table-wrap">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty">No hospitals yet. Add the first one above.</div>
  </section>
</main>
<script src="app.js"></script>
<script>
crudPage({
  name: "hospital",
  listUrl: "/hospitals",
  createUrl: () => "/hospitals",
  itemUrl: id => "/hospitals/" + id,
  idKey: "hid",
  deleteWarning: "Its branches are deleted too.",
  fields: [
    { key: "name", label: "Hospital name" },
    { key: "website", label: "Website" }
  ],
  columns: [
    { key: "hid", label: "ID" },
    { key: "name", label: "Name" },
    { key: "website", label: "Website" }
  ]
});
</script>
</body>
</html>
