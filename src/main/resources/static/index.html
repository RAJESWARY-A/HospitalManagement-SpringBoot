<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hospital Manager</title>
<style>
  :root {
    --ink: #17324d;
    --teal: #0f766e;
    --teal-dark: #0b5a54;
    --mist: #eef4f3;
    --line: #cfdcda;
    --alert: #b4362a;
    --alert-bg: #fbeceb;
    --ok: #1f6b3a;
    --ok-bg: #e6f3ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    color: var(--ink);
    background: var(--mist);
    line-height: 1.5;
  }
  header {
    background: var(--teal);
    color: #fff;
    padding: 18px 24px;
  }
  header h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
  header p { margin: 2px 0 0; font-size: .95rem; opacity: .9; }
  main { max-width: 820px; margin: 24px auto; padding: 0 16px; }
  section {
    background: #fff;
    border: 1px solid var(--line);
    padding: 18px;
    margin-bottom: 20px;
  }
  h2 { margin: 0 0 12px; font-size: 1.1rem; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input {
    flex: 1;
    min-width: 170px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    font: inherit;
    color: inherit;
  }
  input:focus, button:focus-visible { outline: 3px solid #7cc4bd; outline-offset: 1px; }
  button {
    padding: 9px 16px;
    border: 0;
    background: var(--teal);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  button:hover { background: var(--teal-dark); }
  button.plain { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  button.plain:hover { background: var(--mist); }
  button.danger { background: #fff; color: var(--alert); border: 1px solid var(--alert); }
  button.danger:hover { background: var(--alert-bg); }
  .msg { margin-top: 12px; padding: 9px 12px; display: none; }
  .msg.error { display: block; background: var(--alert-bg); color: var(--alert); }
  .msg.ok { display: block; background: var(--ok-bg); color: var(--ok); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { margin-left: 6px; padding: 5px 12px; }
  .empty { padding: 14px 8px; color: #4b6275; }
  @media (max-width: 520px) { td.actions { white-space: normal; } }
</style>
</head>
<body>
<header>
  <h1>Hospital Manager</h1>
  <p>Add, change and remove the hospitals stored in your database.</p>
</header>

<main>
  <section>
    <h2 id="formTitle">Add a hospital</h2>
    <form id="hospitalForm">
      <input id="name" placeholder="Hospital name" aria-label="Hospital name">
      <input id="website" placeholder="Website" aria-label="Website">
      <button type="submit" id="saveBtn">Save hospital</button>
      <button type="button" class="plain" id="cancelBtn" style="display:none">Cancel</button>
    </form>
    <div id="msg" class="msg" role="status"></div>
  </section>

  <section>
    <h2>Hospitals</h2>
    <table>
      <thead>
        <tr><th>ID</th><th>Name</th><th>Website</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" style="display:none">No hospitals yet. Add the first one above.</div>
  </section>
</main>

<script>
  const API = "/hospitals";
  let editId = null;

  function show(text, type) {
    const m = document.getElementById("msg");
    m.textContent = text;
    m.className = "msg " + type;
  }

  async function loadHospitals() {
    try {
      const res = await fetch(API);
      const data = await res.json();
      const body = document.getElementById("rows");
      body.innerHTML = "";
      document.getElementById("empty").style.display = data.length ? "none" : "block";

      data.forEach(h => {
        const tr = document.createElement("tr");
        [h.hid, h.name, h.website].forEach(v => {
          const td = document.createElement("td");
          td.textContent = v == null ? "" : v;
          tr.appendChild(td);
        });

        const td = document.createElement("td");
        td.className = "actions";
        const edit = document.createElement("button");
        edit.className = "plain";
        edit.textContent = "Edit";
        edit.onclick = () => startEdit(h);
        const del = document.createElement("button");
        del.className = "danger";
        del.textContent = "Delete";
        del.onclick = () => removeHospital(h);
        td.append(edit, del);
        tr.appendChild(td);
        body.appendChild(tr);
      });
    } catch (e) {
      show("Cannot reach the server. Start the Spring Boot app and refresh this page.", "error");
    }
  }

  function startEdit(h) {
    editId = h.hid;
    document.getElementById("name").value = h.name || "";
    document.getElementById("website").value = h.website || "";
    document.getElementById("formTitle").textContent = "Edit hospital " + h.hid;
    document.getElementById("saveBtn").textContent = "Save changes";
    document.getElementById("cancelBtn").style.display = "inline-block";
    document.getElementById("name").focus();
  }

  function resetForm() {
    editId = null;
    document.getElementById("hospitalForm").reset();
    document.getElementById("formTitle").textContent = "Add a hospital";
    document.getElementById("saveBtn").textContent = "Save hospital";
    document.getElementById("cancelBtn").style.display = "none";
  }

  document.getElementById("hospitalForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const wasEditing = editId !== null;
    const payload = JSON.stringify({
      name: document.getElementById("name").value,
      website: document.getElementById("website").value
    });
    try {
      const res = await fetch(wasEditing ? API + "/" + editId : API, {
        method: wasEditing ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: payload
      });
      if (!res.ok) {
        const err = await res.json();
        const details = err.errors ? Object.values(err.errors).join(", ") : err.message;
        show(details || "The hospital could not be saved.", "error");
        return;
      }
      show(wasEditing ? "Changes saved" : "Hospital saved", "ok");
      resetForm();
      loadHospitals();
    } catch (e) {
      show("Cannot reach the server. Start the Spring Boot app and try again.", "error");
    }
  });

  async function removeHospital(h) {
    if (!confirm("Delete " + h.name + "? Its branches are deleted too.")) return;
    try {
      const res = await fetch(API + "/" + h.hid, { method: "DELETE" });
      if (res.ok) {
        show("Hospital deleted", "ok");
        loadHospitals();
      } else {
        show("The hospital could not be deleted.", "error");
      }
    } catch (e) {
      show("Cannot reach the server. Start the Spring Boot app and try again.", "error");
    }
  }

  document.getElementById("cancelBtn").onclick = resetForm;
  loadHospitals();
</script>
</body>
</html>
